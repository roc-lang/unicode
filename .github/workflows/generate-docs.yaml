name: Generate docs

on:
  # Run when a release is published
  release:
    types:
      - published

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  generate-docs:
    name: Generate docs
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"
      
      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - run: roc version

      - name: Generate docs
        run: roc docs package/main.roc
      
      - name: Fix absolute paths
        run: |
          find generated-docs/ -type f -name '*.html' -exec sed -i "s/\(href\|src\)=\"\//\1=\"\/${{ github.event.repository.name }}\//g" {} +
      
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: generated-docs

      - name: Deploy docs
        uses: actions/deploy-pages@v4
