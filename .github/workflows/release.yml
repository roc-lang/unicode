name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        type: string
  pull_request:

env:
  ZIG_VERSION: "0.16.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Do not add permissions here. Configure them at the job level.
permissions: {}

jobs:
  build-bundle:
    name: Build package bundle
    runs-on: ubuntu-26.04
    outputs:
      bundle_filename: ${{ steps.bundle.outputs.bundle_filename }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # 2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Run checks
        run: ROC=roc ./scripts/all_tests.sh

      - name: Bundle package
        id: bundle
        run: |
          scripts/bundle.sh --output-dir dist

          shopt -s nullglob
          bundles=(dist/*.tar.zst dist/*.tar.br)
          if [[ ${#bundles[@]} -ne 1 ]]; then
            echo "Error: expected exactly one package bundle in dist"
            exit 1
          fi
          bundle_path=${bundles[0]}

          bundle_filename=$(basename "$bundle_path")
          echo "bundle_filename=$bundle_filename" >> "$GITHUB_OUTPUT"

      - name: Upload package bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-bundle
          path: dist/${{ steps.bundle.outputs.bundle_filename }}
          retention-days: 30

  test-bundle:
    name: Test package bundle (${{ matrix.os }})
    needs: build-bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # 2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Download package bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: package-bundle
          path: dist

      - name: Test examples against downloaded bundle
        run: python3 scripts/test_bundle_examples.py --examples-only --bundle-path "dist/${{ needs.build-bundle.outputs.bundle_filename }}"

  create-release:
    name: Create GitHub release
    needs:
      - build-bundle
      - test-bundle
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download package bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: package-bundle
          path: dist

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4
        with:
          version: nightly
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle_file="dist/${{ needs.build-bundle.outputs.bundle_filename }}"
          roc_version=$(roc version)

          gh release create "${{ github.event.inputs.release_tag }}" \
            "$bundle_file" \
            --title "${{ github.event.inputs.release_tag }}" \
            --generate-notes \
            --notes "Unicode package bundle built with Roc $roc_version."
