on: 
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag or SHA to test. Defaults to the usual checkout for this event.'
        type: string
        required: false
        default: ''

# this cancels workflows currently in progress if you start a new one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Do not add permissions here! Configure them at the job level!
permissions: {}

env:
  ZIG_VERSION: "0.16.0"

jobs:
  fuzz-smoke:
    name: Coverage-guided fuzz smoke (Linux x64)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Read pinned Roc version
        run: printf 'ROC_VERSION=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - uses: roc-lang/setup-roc@19c9da4f0158ca74c4ac27d8999c17b5c2739cbf
        with:
          # .roc-version is a release tag, or a nightly tag when testing nightlies.
          version: ${{ startsWith(env.ROC_VERSION, 'nightly-') && 'nightly' || env.ROC_VERSION }}
          nightly-tag: ${{ startsWith(env.ROC_VERSION, 'nightly-') && env.ROC_VERSION || '' }}

      - name: Run deterministic fuzz suite expectations
        run: ROC=roc python3 scripts/fuzz.py models

      - name: Run bounded fuzz smoke
        run: ROC=roc python3 scripts/fuzz.py smoke

      - name: Upload fuzz failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-evidence
          path: |
            .roc-unicode-tmp/fuzz/reports/
            .roc-fuzz/
          include-hidden-files: true
          if-no-files-found: ignore

  test:
    name: ./scripts/all_tests.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # 2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Read pinned Roc version
        run: printf 'ROC_VERSION=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - id: roc
        uses: roc-lang/setup-roc@19c9da4f0158ca74c4ac27d8999c17b5c2739cbf
        with:
          # .roc-version is a release tag, or a nightly tag when testing nightlies.
          version: ${{ startsWith(env.ROC_VERSION, 'nightly-') && 'nightly' || env.ROC_VERSION }}
          nightly-tag: ${{ startsWith(env.ROC_VERSION, 'nightly-') && env.ROC_VERSION || '' }}

      - run: roc version

      - name: Run checkout-only examples, API checks, and allocation ratchets
        run: ROC=roc ./scripts/all_tests.sh

      # Also save the cache when the job fails, so tests that passed are cached.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.roc.outputs.cache-key != ''
        with:
          path: ${{ steps.roc.outputs.cache-path }}
          key: ${{ steps.roc.outputs.cache-key }}
